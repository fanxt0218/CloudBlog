server:
  port: 9090

file:
  resource:
    prefix: /profile
    path: D:/cloud_blog/upload
    content:
      avatar: /avatar

spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${blog.db.host}:3306/cloud_blog?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${blog.db.pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    openai:
      api-key: ${blog.openai.api-key}
      base-url: ${blog.openai.base-url}
      chat:
        options:
          model: deepseek-v3.1:671b


mybatis-plus:
  mapper-locations: classpath*:/mapper/**.xml


logging:
  level:
    com.cloudblog.user.mapper: debug
    org.apache.ibatis: debug
    org.mybatis: debug
    org.apache.ibatis.jdbc.ScriptRunner: debug
    org.apache.ibatis.transaction.managed.ManagedTransaction: debug


